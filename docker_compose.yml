# do i need this additional shiny installation
  shiny:
    build: .
    container_name: shiny_app
    depends_on:
      - postgres
    ports:
      - "3838:3838"
    environment:
      PG_HOST: postgres
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DB: testdb
